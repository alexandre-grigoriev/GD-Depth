name: gd-depth

services:

  backend:
    image: aipoclab/gd-depth-backend:latest
    restart: unless-stopped
    volumes:
      - ./data/backend.env:/app/.env:ro
      - ./data/users.db:/data/users.db
      - ./data/uploads:/data/uploads
    environment:
      DB_PATH:     /data/users.db
      UPLOADS_DIR: /data/uploads
    networks:
      - gd
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout:  5s
      retries:  5
      start_period: 15s

  frontend:
    image: aipoclab/gd-depth-frontend:latest
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-5238}:80"
      - "${HTTPS_PORT:-5237}:443"
    volumes:
      - /etc/ssl/gd-depth:/etc/ssl/gd-depth:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gd

networks:
  gd:
    driver: bridge
