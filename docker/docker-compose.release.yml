services:

  backend:
    image: gd-depth-backend:latest
    restart: unless-stopped
    volumes:
      - ./data/backend.env:/app/.env:ro
      - ./data/users.db:/data/users.db
    environment:
      DB_PATH: /data/users.db
    networks:
      - gd
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout:  5s
      retries:  5
      start_period: 15s

  frontend:
    image: gd-depth-frontend:latest
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - /etc/ssl/gd-depth:/etc/ssl/gd-depth:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gd

networks:
  gd:
    driver: bridge
