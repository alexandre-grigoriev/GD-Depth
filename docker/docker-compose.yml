services:

  # ── Backend — Node.js / Express ──────────────────────────────────────────────
  backend:
    image: gd-depth-backend:latest
    build:
      context: ..                           # project root
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    volumes:
      # .env is mounted read-only so secrets never bake into the image
      - ./data/backend.env:/app/.env:ro
      # Persistent SQLite database
      - ./data/users.db:/data/users.db
    environment:
      DB_PATH: /data/users.db
    networks:
      - gd
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout:  5s
      retries:  5
      start_period: 15s

  # ── Frontend — React SPA served by Nginx (also reverse-proxies the backend) ─
  frontend:
    image: gd-depth-frontend:latest
    build:
      context: ..                           # project root
      dockerfile: docker/Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gd

networks:
  gd:
    driver: bridge
